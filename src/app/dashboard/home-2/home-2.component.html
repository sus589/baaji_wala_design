<div class="container wrap" >
    <div class="row">
       <div >
         <!-- Top Tabs (Live / Upcoming / Leagues / Parlay) -->
        <div class="container mt-2">
            <div class="top-tabs">
                <div class="tab active">Live</div>
                <div class="tab">Upcoming</div>
                <div class="tab">Leagues</div>
                <div class="tab text-success">Parlay</div>
            </div>
        </div>
        <!-- Sports Icon Bar -->
        <div class="sports-bar">
            <div class="container">
                <div class="row text-center">
                    <div class="col sport-item">
                        <img src="assets/images/chip.webp" alt="">
                        Casino
                    </div>
                    <div class="col sport-item">
                        My Fav 
                         <span class="badge bg-warning text-dark">0</span>
                    </div>
                    <div class="col sport-item active">
                        Cricket <span class="badge bg-danger">5</span>
                    </div>
                    <div class="col sport-item">
                        Soccer <span class="badge bg-warning text-dark">8</span>
                    </div>
                    <div class="col sport-item">
                        Tennis <span class="badge bg-warning text-dark">12</span>
                    </div>
                </div>
            </div>
        </div>
        <!-- Filter Bar -->
        <div class="filter-bar mt-2">
            <button class="btn btn-light btn-sm">
                ⇅ by Competition
            </button>

            <button class="btn btn-light btn-sm">
                Collapse ⌄
            </button>
        </div>
        <!-- League + Match (One Day Internationals) -->
        <div class="container">
            <div class="league-header">
                One Day Internationals
                <span class="badge bg-primary">1</span>
            </div>

            <div class="match-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        ⭐ <strong>Sri Lanka v England</strong><br>
                        <span class="inplay">In-play</span>
                        <small class="text-muted">Matched 0.00</small>
                    </div>
                    <div>
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </div>
            </div>
        </div>
        <!-- Women’s Premier League (Back / Lay) -->
        <div class="container mt-3">
            <div class="league-header">
                Women_s Premier League
                <span class="badge bg-primary">1</span>
            </div>

            <div class="match-card">
                <div class="d-flex justify-content-between mb-2">
                    <div>
                        ⭐ <strong>Gujarat Giants W v Delhi Capitals W</strong><br>
                        <span class="inplay">In-play</span>
                    </div>
                </div>

                <div class="row text-center fw-bold mb-1">
                    <div class="col-8"></div>
                    <div class="col-2">Back</div>
                    <div class="col-2">Lay</div>
                </div>

                <div class="row align-items-center mb-2" style="margin: -4px;">
                    <div class="col-8">Gujarat Giants W</div>
                    <div class="col-2 back">--</div>
                    <div class="col-2 lay">--</div>
                </div>

                <div class="row align-items-center" style="margin: -4px;">
                    <div class="col-8">Delhi Capitals W</div>
                    <div class="col-2 back">--</div>
                    <div class="col-2 lay">--</div>
                </div>
            </div>
        </div>
       </div>

    </div>
</div>
